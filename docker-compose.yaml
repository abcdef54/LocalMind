services:
  db:
    image: postgres:15-alpine
    container_name: localmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: localmind_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d localmind_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: localmind_llamaswap
    restart: unless-stopped
    ports:
      - "${LLAMA_SWAP_PORT:-18000}:18000"
    volumes:
      - ./src/backend/ai/llms/cpp_models:/models
      - ./llama_swap_config.yaml:/app/config.yaml
    command: --config /app/config.yaml --watch-config --listen 0.0.0.0:18000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  backend:
    build:
      context: .
      dockerfile: ./src/backend/backend.Dockerfile
    container_name: localmind_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRESQL_URL: postgresql+asyncpg://postgres:admin@db:5432/localmind_db
      PYTHONPATH: /app
      LOCAL_LLM_URL: http://llama-swap:18000/v1
      DEFAULT_CONTEXT_LENGTH_K: ${DEFAULT_CONTEXT_LENGTH_K:-32}
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend/ai/llms/cpp_models:/app/src/backend/ai/llms/cpp_models
      - ./.uploads:/app/.uploads
      - ./llama_swap_config.yaml:/app/llama_swap_config.yaml
    depends_on:
      db:
        condition: service_healthy
      llama-swap:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/frontend.Dockerfile
    container_name: localmind_frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres_data:
